<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F6B68"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Quórum Vila Jacuí</title><style>:root{--ink:#152326;--mut:#6b7778;--teal:#0F6B68;--line:#dce4e3;--bg:#f3f6f5;--danger:#a33a3a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.hide{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:24px}.loginbox{width:min(430px,100%);background:#fff;padding:30px 26px;border-top:5px solid var(--teal)}.brand{display:flex;align-items:center;gap:16px}.logo{width:68px;height:68px;object-fit:contain}.brand h1{font-size:27px;margin:0}.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);font-weight:800}.eyebrow.light{color:#cce3e1}.mut,small{color:var(--mut)}input,textarea,select{width:100%;padding:12px;border:1px solid #cfd9d7;border-radius:7px;margin:6px 0 13px;background:#fff}label{display:block;font-size:13px;font-weight:700;color:#465554}.primary{border:0;background:var(--teal);color:#fff;padding:12px 16px;font-weight:750;border-radius:7px}.wide{width:100%}.shell{max-width:1040px;margin:auto;padding:20px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 17px}.top h1{font-size:27px;margin:2px 0}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-weight:800}.nav{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:22px}.nav button{border:0;background:transparent;padding:12px 11px;white-space:nowrap;color:#657172}.nav button.on{color:var(--teal);font-weight:800;border-bottom:3px solid var(--teal)}.hero{background:var(--teal);color:#fff;padding:25px 22px;margin-bottom:14px}.hero h2{font-size:28px;margin:5px 0}.hero .mut{color:#d6e8e7}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:#fff;margin-bottom:14px}.metrics div{padding:15px;border-right:1px solid var(--line)}.metrics div:last-child{border:0}.metrics b{display:block;font-size:21px;color:var(--teal)}.metrics span{font-size:10px;color:var(--mut)}.section{background:#fff;border:1px solid var(--line);margin:12px 0}.sectionHead{padding:18px}.sectionHead h2{margin:0;font-size:20px}.sectionHead .mut{font-size:11px;margin-top:4px}.sectionBody{padding:0 18px 18px}.item{padding:13px 0;border-top:1px solid #edf0ef}.item b,.item small{display:block}.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 10px;margin-top:8px}.danger{color:var(--danger);border-color:#e6c8c8}.actionsRow{display:flex;gap:6px;flex-wrap:wrap}.scheduleRow{border-top:1px solid var(--line)}.scheduleToggle{width:100%;border:0;background:#fff;padding:16px 3px;display:flex;align-items:center;justify-content:space-between;text-align:left}.scheduleToggle.sub{background:transparent;padding:13px 0}.scheduleToggle b,.scheduleToggle small{display:block}.inlinePlan{background:#f5f9f8;border-left:3px solid var(--teal);padding:17px;margin-bottom:14px}.inlinePlan.nested{margin-top:6px}.inlineConfirm{margin-top:9px;padding:12px;border-left:3px solid var(--danger);background:#fff8f8}.inlineConfirm span{display:block;color:var(--mut);font-size:11px;margin:3px 0}.checkGroup{padding:8px 0 15px}.checkGroup label{padding:8px 0;font-weight:500}.checkGroup input{width:auto;margin-right:6px}.attendanceBox,.minuteTasks{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}.attendanceLine{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.attendanceLine select{margin:0}.brother{display:flex;justify-content:space-between;align-items:center;gap:10px}.splitTitle{display:flex;justify-content:space-between;padding:16px 0 7px;color:var(--teal)}.splitTitle span{color:var(--mut)}.saveError{padding:12px;background:#fff2f2;border-left:3px solid var(--danger);margin-bottom:12px}@media(max-width:650px){.attendanceLine{grid-template-columns:1fr}.inlinePlan{margin-left:-8px;margin-right:-8px}.metrics{grid-template-columns:1fr 1fr}.metrics div:nth-child(2){border-right:0}.metrics div:nth-child(-n+2){border-bottom:1px solid var(--line)}.brother{align-items:flex-start}.top h1{font-size:25px}}</style><link rel="stylesheet" href="mw-inspired-design.css?v=ea4fe84"><link rel="stylesheet" href="ios-polish-v1.css?v=f58065c"></head><body><div id="loginScreen" class="login"><div class="loginbox"><div class="brand"><img class="logo" src="logo-quorum.svg?v=4"><div><div class="eyebrow">Ala Vila Jacuí</div><h1>Quórum de Élderes</h1></div></div><input id="pw" type="password" placeholder="Sua senha"><button id="loginBtn" class="primary wide">Entrar</button><div id="err" class="mut"></div></div></div><main id="appScreen" class="shell hide"><header class="top"><div><div class="eyebrow" id="role"></div><h1 id="hello"></h1></div><div class="avatar" id="avatar"></div></header><nav class="nav" id="nav"></nav><section id="view"></section></main><script>const API='https://fttvimhhxopvzxqrpsuk.supabase.co/functions/v1/quorum-app';let token=localStorage.getItem('qv_session')||'',me=null,state={},converts=[];async function call(action,extra={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...extra})}),j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function load(){let j=await call('get');me=j.profile;state=j.state||{};converts=j.converts||[];window.qvMeetingItems=j.meetingItems||[];start()}function start(){loginScreen.classList.add('hide');appScreen.classList.remove('hide');hello.textContent=me.name.split(' ')[0];role.textContent=me.label+' · Ala Vila Jacuí';avatar.textContent=me.name.split(' ').slice(0,2).map(x=>x[0]).join('');let tabs=['Início','Presidência','Aulas','Frequência','Irmãos','Ministração','Recém-conversos'];if(me.assistance)tabs.push('Ajudas');if(me.manage)tabs.push('Acessos');nav.innerHTML=tabs.map(x=>'<button>'+x+'</button>').join('');currentTab='Início';renderTab()}async function doLogin(){if(!pw.value)return;err.textContent='';loginBtn.disabled=true;loginBtn.textContent='Entrando…';try{let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',password:pw.value})}),j=await r.json();if(!r.ok)throw Error(j.error||'Senha inválida');token=j.token;localStorage.setItem('qv_session',token);await load()}catch(x){err.textContent=x.message;loginBtn.disabled=false;loginBtn.textContent='Entrar'}}loginBtn.onclick=doLogin;pw.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});window.addEventListener('DOMContentLoaded',async()=>{if(token)try{await load()}catch(e){localStorage.removeItem('qv_session');token='';err.textContent='A sessão expirou. Entre novamente.'}});</script><script src="tabs3.js?v=c20f74f"></script><script src="meeting-save-flexible.js?v=4899bd5"></script><script src="action-workflow.js?v=8cbfe50"></script><script src="meeting-title-live.js?v=24460b1"></script><script src="continuous-planning.js?v=b6fbc8e"></script><script src="period-views.js?v=53b0e3c"></script><script src="converts-sync.js?v=717df1a"></script><script src="ministering-districts.js?v=4e7dfaa"></script><script src="ministering-reports.js?v=e131c38"></script><script src="presidency-dropdowns.js?v=47f7c24"></script><script src="lesson-dropdowns.js?v=427ecba"></script><script src="lesson-cancellations.js?v=f85f0ee"></script><script src="interactive-metrics.js?v=e67b58d"></script><script src="home-actions.js?v=ae16aa5"></script><script src="backend-ui.js?v=cb4451f"></script><script src="access-controls.js?v=f862436"></script><script src="quo
