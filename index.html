<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F6B68"><title>Quórum Vila Jacuí</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#17202a}.login{min-height:100dvh;display:grid;place-items:center;padding:28px}.loginbox,.card{background:#fff;border-radius:22px;padding:24px}.loginbox{width:min(420px,100%);box-sizing:border-box}.brand{display:flex;align-items:center;gap:14px}.logo{width:68px;height:68px;object-fit:contain;border-radius:50%;background:#fff}.mut{color:#6d747c}input{box-sizing:border-box;width:100%;border:1px solid #d8dcdf;border-radius:13px;padding:13px;margin:8px 0 12px;font:inherit}.primary{width:100%;border:0;border-radius:14px;background:#0F6B68;color:#fff;font-weight:700;padding:14px;font:inherit}.hide{display:none!important}.shell{max-width:920px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#0F6B68;color:white;font-weight:800}.nav{display:flex;gap:8px;overflow:auto;padding:18px 0}.nav button{border:0;background:#fff;padding:10px 12px;border-radius:12px;white-space:nowrap}.nav button.on{background:#0F6B68;color:#fff}.hero{background:#0F6B68;color:#fff;border-radius:18px;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border-radius:16px;padding:16px}.stat b{display:block;font-size:24px;color:#0F6B68}.item{padding:12px 0;border-bottom:1px solid #eee}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><div class="loginbox"><div class="brand"><img class="logo" src="logo-quorum.svg?v=f0429e7"><div><h1 style="margin:0">Quórum Vila Jacuí</h1><div class="mut">Presidência do Quórum de Élderes</div></div></div><p class="mut">Digite somente sua senha. O app reconhecerá automaticamente seu acesso.</p><input id="pw" type="password" placeholder="Sua senha"><button id="loginBtn" class="primary">Entrar</button><div id="err" class="mut" style="margin-top:12px"></div></div></div><main id="app" class="shell hide"><header class="top"><div><div class="mut" id="role"></div><h1 id="hello"></h1></div><div class="avatar" id="avatar"></div></header><nav class="nav" id="nav"></nav><section id="view"></section></main><script>const API='https://fttvimhhxopvzxqrpsuk.supabase.co/functions/v1/quorum-app';let token='',me=null,state={meetings:[],lessons:[],interviews:[],assistance:[]},converts=[];async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function load(){const j=await call('get');me=j.profile;state={meetings:[],lessons:[],interviews:[],assistance:[],...j.state};converts=j.converts||[];start()}function start(){login.classList.add('hide');app.classList.remove('hide');hello.textContent='Olá, '+me.name.split(' ')[0];role.textContent=me.label+' · Ala Vila Jacuí';avatar.textContent=me.name.split(' ').slice(0,2).map(x=>x[0]).join('');const tabs=['Início','Presidência','Aulas','Ministração','Recém-conversos'];if(me.assistance)tabs.push('Ajudas');if(me.manage)tabs.push('Acessos');nav.innerHTML=tabs.map(x=>'<button>'+x+'</button>').join('');view.innerHTML=homeView()}</script><script src="hotfix.js?v=e652778"></script><script src="tabs.js?v=95a9fa2"></script></body></html>
