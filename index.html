<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F6B68"><title>Quórum Vila Jacuí</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#17202a}.login{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.loginbox,.card{background:#fff;border-radius:22px;padding:22px;box-sizing:border-box}.loginbox{width:min(430px,100%)}.brand{display:flex;align-items:center;gap:14px}.logo{width:72px;height:72px;object-fit:contain;display:block;flex:0 0 72px}.brand h1{margin:0;font-size:26px;line-height:1.08}.mut,small{color:#6d747c}.primary,.secondary,.mini{border:0;border-radius:12px;padding:13px;font:inherit;cursor:pointer}.primary{width:100%;background:#0F6B68;color:#fff;font-weight:700;margin:8px 0}.secondary{width:100%;background:#e8eeee;margin-top:16px}.mini{background:#e8eeee;padding:8px 11px;margin-top:8px}input{box-sizing:border-box;width:100%;border:1px solid #d8dcdf;border-radius:13px;padding:13px;margin:8px 0 12px;font:inherit}.hide{display:none!important}.shell{max-width:920px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:4px 0}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#0F6B68;color:#fff;font-weight:800}.nav{display:flex;gap:7px;overflow-x:auto;padding:16px 0;-webkit-overflow-scrolling:touch}.nav button{border:0;background:#fff;padding:10px 12px;border-radius:11px;white-space:nowrap;font:inherit}.nav button.on{background:#0F6B68;color:#fff}.hero{background:#0F6B68;color:#fff;border-radius:18px;padding:18px}.hero .mut{color:#e5f2f1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}.stat{background:#fff;border-radius:16px;padding:16px}.stat b{display:block;font-size:24px;color:#0F6B68}.item{padding:14px 0;border-bottom:1px solid #e9ebed}.item b,.item small{display:block}h2{margin-top:0}@media(max-width:620px){.grid{grid-template-columns:1fr}.brand h1{font-size:24px}.logo{width:68px;height:68px;flex-basis:68px}}</style></head><body><div id="loginScreen" class="login"><div class="loginbox"><div class="brand"><img class="logo" src="logo-quorum.svg?v=3" alt="Vila Jacuí"><div><h1>Quórum Vila Jacuí</h1><div class="mut">Presidência do Quórum de Élderes</div></div></div><p class="mut">Digite somente sua senha. O app reconhecerá automaticamente seu acesso.</p><input id="pw" type="password" placeholder="Sua senha" autocomplete="current-password"><button id="loginBtn" class="primary" type="button">Entrar</button><div id="err" class="mut"></div></div></div><main id="appScreen" class="shell hide"><header class="top"><div><div class="mut" id="role"></div><h1 id="hello"></h1></div><div class="avatar" id="avatar"></div></header><nav class="nav" id="nav"></nav><section id="view"></section></main><script>const API='https://fttvimhhxopvzxqrpsuk.supabase.co/functions/v1/quorum-app';let token='',me=null,state={meetings:[],lessons:[],interviews:[],assistance:[]},converts=[];async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function load(){const j=await call('get');me=j.profile;state={meetings:[],lessons:[],interviews:[],assistance:[],...j.state};converts=j.converts||[];start()}function start(){document.getElementById('loginScreen').classList.add('hide');document.getElementById('appScreen').classList.remove('hide');document.getElementById('hello').textContent='Olá, '+me.name.split(' ')[0];document.getElementById('role').textContent=me.label+' · Ala Vila Jacuí';document.getElementById('avatar').textContent=me.name.split(' ').slice(0,2).map(x=>x[0]).join('');const tabs=['Início','Presidência','Aulas','Ministração','Recém-conversos'];if(me.assistance)tabs.push('Ajudas');if(me.manage)tabs.push('Acessos');document.getElementById('nav').innerHTML=tabs.map(x=>'<button type="button">'+x+'</button>').join('');currentTab='Início';renderTab()}async function doLogin(){const pw=document.getElementById('pw'),err=document.getElementById('err'),btn=document.getElementById('loginBtn');if(!pw.value){err.textContent='Digite sua senha.';return}btn.disabled=true;btn.textContent='Entrando…';err.textContent='';try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',password:pw.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Senha inválida');token=j.token;me=j.profile;await load()}catch(e){err.textContent=e.message||'Não foi possível entrar.'}finally{btn.disabled=false;btn.textContent='Entrar'}}document.getElementById('loginBtn').addEventListener('click',doLogin);document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin()}});</script><script src="tabs.js?v=6db71525"></script></body></html>
