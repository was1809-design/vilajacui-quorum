<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F6B68"><title>Quórum Vila Jacuí</title><style>:root{--ink:#152326;--mut:#6b7778;--teal:#0F6B68;--pale:#edf5f4;--line:#dce4e3;--bg:#f3f6f5}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.hide{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:24px}.loginbox{width:min(430px,100%);background:#fff;padding:30px 26px;border-top:5px solid var(--teal)}.brand{display:flex;align-items:center;gap:16px}.logo{width:68px;height:68px;object-fit:contain}.brand h1{font-size:27px;margin:0}.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);font-weight:800}.mut,small{color:var(--mut)}input,textarea{width:100%;padding:12px;border:1px solid #cfd9d7;border-radius:7px;margin:6px 0 13px;background:#fff}label{display:block;font-size:13px;font-weight:700;color:#465554}.primary{border:0;background:var(--teal);color:#fff;padding:12px 16px;font-weight:750;border-radius:7px}.wide{width:100%}.shell{max-width:1040px;margin:auto;padding:20px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 17px}.top h1{font-size:27px;margin:2px 0}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-weight:800}.nav{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:22px}.nav button{border:0;background:transparent;padding:12px 11px;white-space:nowrap;color:#657172}.nav button.on{color:var(--teal);font-weight:800;border-bottom:3px solid var(--teal)}.hero{background:var(--teal);color:#fff;padding:25px 22px;margin-bottom:14px}.hero h2{font-size:28px;margin:5px 0}.hero .mut{color:#d6e8e7}.metrics{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);margin-bottom:18px}.metric{padding:18px;border-right:1px solid var(--line)}.metric b{display:block;font-size:29px;color:var(--teal)}.section{background:#fff;border:1px solid var(--line);margin:12px 0}.sectionHead{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px}.sectionHead h2{margin:0;font-size:20px}.sectionBody{padding:0 18px 18px}.attention,.item{padding:13px 0;border-top:1px solid #edf0ef}.item b,.item small{display:block}.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px}.scheduleRow{border-top:1px solid var(--line)}.scheduleToggle{width:100%;border:0;background:#fff;padding:16px 3px;display:flex;align-items:center;justify-content:space-between;text-align:left}.scheduleToggle b,.scheduleToggle small{display:block}.inlinePlan{background:#f5f9f8;border-left:3px solid var(--teal);padding:17px;margin-bottom:14px}.checkGroup{padding:8px 0 15px}.checkGroup label{padding:8px 0;font-weight:500}.checkGroup input,.personCheck input{width:auto;margin:0 6px 0 0}.attendanceBox{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}.personCheck{display:grid;grid-template-columns:minmax(150px,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #e5ecea}@media(max-width:650px){.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.personCheck{grid-template-columns:1fr}.top h1{font-size:24px}.inlinePlan{margin-left:-8px;margin-right:-8px}}</style></head><body><div id="loginScreen" class="login"><div class="loginbox"><div class="brand"><img class="logo" src="logo-quorum.svg?v=4"><div><div class="eyebrow">Ala Vila Jacuí</div><h1>Quórum de Élderes</h1></div></div><input id="pw" type="password" placeholder="Sua senha"><button id="loginBtn" class="primary wide">Entrar</button><div id="err" class="mut"></div></div></div><main id="appScreen" class="shell hide"><header class="top"><div><div class="eyebrow" id="role"></div><h1 id="hello"></h1></div><div class="avatar" id="avatar"></div></header><nav class="nav" id="nav"></nav><section id="view"></section></main><script>const API='https://fttvimhhxopvzxqrpsuk.supabase.co/functions/v1/quorum-app';let token=localStorage.getItem('qv_session')||'',me=null,state={meetings:[],lessons:[],interviews:[],assistance:[]},converts=[];async function call(action,extra={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...extra})}),j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function load(){let j=await call('get');me=j.profile;state={meetings:[],lessons:[],interviews:[],assistance:[],...j.state};converts=j.converts||[];start()}function start(){loginScreen.classList.add('hide');appScreen.classList.remove('hide');hello.textContent=me.name.split(' ')[0];role.textContent=me.label+' · Ala Vila Jacuí';avatar.textContent=me.name.split(' ').slice(0,2).map(x=>x[0]).join('');let tabs=['Início','Presidência','Aulas','Frequência','Irmãos','Ministração','Recém-conversos'];if(me.assistance)tabs.push('Ajudas');if(me.manage)tabs.push('Acessos');nav.innerHTML=tabs.map(x=>'<button>'+x+'</button>').join('');currentTab='Início';renderTab()}async function doLogin(){if(!pw.value)return err.textContent='Digite sua senha.';try{let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',password:pw.value})}),j=await r.json();if(!r.ok)throw Error(j.error);token=j.token;localStorage.setItem('qv_session',token);await load()}catch(x){err.textContent=x.message}}loginBtn.onclick=doLogin;window.addEventListener('DOMContentLoaded',async()=>{if(token)try{await load()}catch(e){localStorage.removeItem('qv_session');token=''}});</script><script src="tabs.js?v=c9e4e74"></script></body></html>
