<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F6B68"><title>Quórum Vila Jacuí</title><style>:root{--c:#0F6B68;--c2:#0a504e;--bg:#f4f5f7;--ink:#17202a;--mut:#6d747c;--line:#e2e5e8;--red:#a83232}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hide{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:28px}.loginbox{width:min(420px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 18px 50px #10202012}.brand{display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;background:var(--c);-webkit-mask:url('https://raw.githubusercontent.com/was1809-design/vilajacui-mw/main/vj_logo.png') center/contain no-repeat;mask:url('https://raw.githubusercontent.com/was1809-design/vilajacui-mw/main/vj_logo.png') center/contain no-repeat}.brand h1{font-size:24px;margin:0}.mut{color:var(--mut)}input,select,textarea{width:100%;border:1px solid #d8dcdf;border-radius:13px;padding:13px;background:#fff;margin:6px 0 12px}textarea{min-height:95px;resize:vertical}.primary{width:100%;border:0;border-radius:14px;background:var(--c);color:#fff;font-weight:700;padding:14px}.shell{max-width:920px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.who{font-size:13px;color:var(--mut)}.top h1{font-size:25px;margin:2px 0}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:white;font-weight:800}.nav{display:flex;gap:7px;overflow:auto;padding:18px 0 10px;scrollbar-width:none}.nav button{border:0;background:transparent;padding:10px 12px;border-radius:12px;white-space:nowrap;color:var(--mut);font-weight:650}.nav button.on{background:#fff;color:var(--c);box-shadow:0 2px 12px #0000000a}.hero{background:var(--c);color:#fff;border-radius:22px;padding:22px;margin:8px 0 18px}.hero h2{margin:0 0 6px;font-size:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{display:block;font-size:25px;color:var(--c)}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.sectionHead h2{font-size:19px;margin:0}.add{border:0;background:var(--c);color:#fff;border-radius:11px;padding:9px 12px;font-weight:700}.list{display:grid;gap:9px}.row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.row h3{margin:0 0 5px;font-size:17px}.meta{font-size:13px;color:var(--mut)}.tag{display:inline-block;font-size:12px;padding:4px 8px;border-radius:20px;background:#e7f2f1;color:var(--c2);font-weight:700;margin-top:7px}.modal{position:fixed;inset:0;background:#0006;display:grid;align-items:end;z-index:10}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:88dvh;overflow:auto}.sheet h2{margin:0 0 14px}.actions{display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:12px;padding:12px}.ghost{background:#eef0f2}.danger{color:var(--red)}.person{display:flex;gap:12px;align-items:center}.dot{width:38px;height:38px;border-radius:50%;background:#dceceb;color:var(--c);display:grid;place-items:center;font-weight:800}.adminrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.smallbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--c);font-weight:700}.empty{text-align:center;color:var(--mut);padding:28px 10px}.file{font-size:13px;background:#f0f2f3;padding:8px;border-radius:9px;margin-top:7px}@media(max-width:620px){.grid{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.shell{padding-left:12px;padding-right:12px}.hero{border-radius:18px}}</style></head><body><div id="login" class="login"><div class="loginbox"><div class="brand"><div class="logo"></div><div><h1>Quórum Vila Jacuí</h1><div class="mut">Presidência do Quórum de Élderes</div></div></div><p class="mut" style="margin:24px 0 12px">Digite somente sua senha. O app reconhecerá automaticamente seu acesso.</p><input id="pw" type="password" placeholder="Sua senha" autocomplete="current-password"><button class="primary" onclick="login()">Entrar</button><div id="err" class="mut" style="margin-top:12px"></div></div></div><main id="app" class="shell hide"><header class="top"><div><div class="who" id="role"></div><h1 id="hello"></h1></div><div class="avatar" id="avatar"></div></header><nav class="nav" id="nav"></nav><section id="view"></section></main><div id="modal" class="modal hide" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><script>const API='https://fttvimhhxopvzxqrpsuk.supabase.co/functions/v1/quorum-app';let token=localStorage.qv_token||'',me=null,state={meetings:[],lessons:[],interviews:[],assistance:[]},converts=[];const tabs=[['home','Início'],['meetings','Presidência'],['lessons','Aulas'],['interviews','Ministração'],['converts','Recém-conversos'],['assistance','Ajudas'],['admin','Acessos']];async function call(action,extra={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...extra})});let j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function login(){try{document.querySelector('#err').textContent='Entrando…';let j=await call('login',{password:document.querySelector('#pw').value});token=j.token;localStorage.qv_token=token;me=j.profile;await load();}catch(e){document.querySelector('#err').textContent=e.message}}async function load(){try{let j=await call('get');me=j.profile;state={meetings:[],lessons:[],interviews:[],assistance:[],...j.state};converts=j.converts||[];start()}catch(e){localStorage.removeItem('qv_token');token='';document.querySelector('#login').classList.remove('hide');document.querySelector('#app').classList.add('hide')}}function start(){document.querySelector('#login').classList.add('hide');document.querySelector('#app').classList.remove('hide');document.querySelector('#hello').textContent='Olá, '+me.name.split(' ')[0];document.querySelector('#role').textContent=me.label+' · Ala Vila Jacuí';document.querySelector('#avatar').textContent=me.name.split(' ').slice(0,2).map(x=>x[0]).join('');renderNav();show('home')}function renderNav(){nav.innerHTML=tabs.filter(x=>(x[0]!=='assistance'||me.assistance)&&(x[0]!=='admin'||me.manage)).map(x=>`<button data-v="${x[0]}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}function show(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({home,meetings,lessons,interviews,converts,assistance,admin}[v]||home)()}function fmt(d){if(!d)return 'Sem data';return new Date(d+'T12:00').toLocaleDateString('pt-BR')}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function home(){let pending=state.interviews.filter(x=>!x.completed).length;view.innerHTML=`<div class="hero"><div class="brand"><div class="logo" style="background:#fff"></div><div><h2>Presidência do Quórum</h2><div style="opacity:.82">Um lugar para organizar, registrar e acompanhar.</div></div></div></div><div class="grid"><div class="stat"><b>${state.meetings.length}</b><span>reuniões registradas</span></div><div class="stat"><b>${pending}</b><span>entrevistas a acompanhar</span></div><div class="stat"><b>${converts.length}</b><span>recém-conversos do quórum</span></div></div><div class="sectionHead"><h2>Visão rápida</h2></div><div class="card"><b>${me.name}</b><div class="meta">${me.label}</div><p class="mut">Os dados de recém-conversos são importados online do acompanhamento da ala, sem criar ligação visual entre os aplicativos.</p></div>`}function listPage(type,title,sub){let a=state[type]||[];view.innerHTML=`<div class="sectionHead"><div><h2>${title}</h2><div class="meta">${sub}</div></div><button class="add" onclick="edit('${type}')">+ Novo</button></div><div class="list">${a.length?a.slice().reverse().map(x=>item(type,x)).join(''):'<div class="empty">Nenhum registro ainda.</div>'}</div>`}function item(t,x){if(t==='meetings')return `<div class="row" onclick="edit('${t}','${x.id}')"><h3>${fmt(x.date)} · ${esc(x.title||'Reunião de presidência')}</h3><div class="meta">${esc(x.participants||'Participantes não informados')}</div><div class="tag">${esc(x.status||'Registrada')}</div></div>`;if(t==='lessons')return `<div class="row" onclick="edit('${t}','${x.id}')"><h3>${fmt(x.date)} · ${esc(x.topic||'Aula')}</h3><div class="meta">Professor: ${esc(x.teacher||'A definir')}</div></div>`;if(t==='interviews')return `<div class="row" onclick="edit('${t}','${x.id}')"><h3>${esc(x.brother||'Entrevista')}</h3><div class="meta">${fmt(x.date)} · feita por ${esc(x.by||me.name)}</div><div class="tag">${x.completed?'Realizada':'A acompanhar'}</div></div>`;return ''}function meetings(){listPage('meetings','Reuniões de Presidência','Pautas, decisões e acompanhamentos')}function lessons(){listPage('lessons','Aulas do Quórum','Planejamento de professores e temas')}function interviews(){listPage('interviews','Entrevistas de Ministração','Apoio à presidência; o registro oficial continua no LCR')}function edit(type,id){let x=(state[type]||[]).find(y=>y.id===id)||{id:crypto.randomUUID()};let forms={meetings:`<label>Data</label><input id="fdate" type="date" value="${x.date||''}"><label>Título</label><input id="ftitle" value="${esc(x.title||'Reunião de presidência')}"><label>Participantes</label><input id="fparticipants" value="${esc(x.participants||'')}"><label>Pauta / assuntos</label><textarea id="fnotes">${esc(x.notes||'')}</textarea><label>Decisões e acompanhamentos</label><textarea id="fdecisions">${esc(x.decisions||'')}</textarea>`,lessons:`<label>Data</label><input id="fdate" type="date" value="${x.date||''}"><label>Tema / discurso</label><input id="ftopic" value="${esc(x.topic||'')}"><label>Professor</label><input id="fteacher" value="${esc(x.teacher||'')}"><label>Observações</label><textarea id="fnotes">${esc(x.notes||'')}</textarea>`,interviews:`<label>Irmão / dupla de ministração</label><input id="fbrother" value="${esc(x.brother||'')}"><label>Data</label><input id="fdate" type="date" value="${x.date||''}"><label>Entrevistador</label><input id="fby" value="${esc(x.by||me.name)}"><label>Observação de acompanhamento</label><textarea id="fnotes">${esc(x.notes||'')}</textarea><label><input id="fcompleted" type="checkbox" style="width:auto" ${x.completed?'checked':''}> Entrevista realizada</label>`};sheet.innerHTML=`<h2>${id?'Editar':'Novo registro'}</h2>${forms[type]}<div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button style="background:var(--c);color:#fff" onclick="saveForm('${type}','${x.id}')">Salvar</button></div>${id?`<button class="primary danger" style="margin-top:10px;background:#fff;border:1px solid #eee" onclick="del('${type}','${x.id}')">Excluir</button>`:''}`;modal.classList.remove('hide')}async function saveForm(t,id){let g=n=>document.querySelector('#f'+n);let x={id,updatedBy:me.name,updatedAt:new Date().toISOString()};if(t==='meetings')Object.assign(x,{date:g('date').value,title:g('title').value,participants:g('participants').value,notes:g('notes').value,decisions:g('decisions').value,status:'Registrada'});if(t==='lessons')Object.assign(x,{date:g('date').value,topic:g('topic').value,teacher:g('teacher').value,notes:g('notes').value});if(t==='interviews')Object.assign(x,{date:g('date').value,brother:g('brother').value,by:g('by').value,notes:g('notes').value,completed:g('completed').checked});let i=state[t].findIndex(y=>y.id===id);i<0?state[t].push(x):state[t][i]=x;await save();closeModal();show(t)}async function del(t,id){state[t]=state[t].filter(x=>x.id!==id);await save();closeModal();show(t)}async function save(){await call('save',{state})}function converts(){view.innerHTML=`<div class="sectionHead"><div><h2>Recém-conversos do Quórum</h2><div class="meta">Importados automaticamente do acompanhamento online</div></div></div><div class="list">${converts.map(x=>`<div class="row"><div class="person"><div class="dot">${esc(x.nome).split(' ').slice(0,2).map(n=>n[0]).join('')}</div><div><h3>${esc(x.nome)}</h3><div class="meta">${esc(x.statusMembro)} · Sacerdócio: ${esc(x.sacerdocio)}</div></div></div><div class="tag">Recomendação: ${esc(x.recomendacao)}</div>${x.ministradoresNomes?`<div class="meta" style="margin-top:8px">Ministradores: ${esc(x.ministradoresNomes)}</div>`:''}</div>`).join('')||'<div class="empty">Nenhum recém-converso do Quórum encontrado.</div>'}</div>`}function assistance(){let a=state.assistance||[];view.innerHTML=`<div class="sectionHead"><div><h2>Ajudas aos irmãos</h2><div class="meta">Área exclusiva do Presidente</div></div><button class="add" onclick="editHelp()">+ Nova</button></div><div class="list">${a.length?a.slice().reverse().map(x=>`<div class="row" onclick="editHelp('${x.id}')"><h3>${esc(x.name)}</h3><div class="meta">${fmt(x.date)} · ${esc(x.kind||'Ajuda')}</div>${x.amount?`<div class="tag">R$ ${esc(x.amount)}</div>`:''}${x.fileName?`<div class="file">Anexo: ${esc(x.fileName)}</div>`:''}</div>`).join(''):'<div class="empty">Nenhuma ajuda registrada.</div>'}</div>`}function editHelp(id){let x=(state.assistance||[]).find(y=>y.id===id)||{id:crypto.randomUUID()};sheet.innerHTML=`<h2>${id?'Editar ajuda':'Nova ajuda'}</h2><label>Irmão</label><input id="hname" value="${esc(x.name||'')}"><label>Data</label><input id="hdate" type="date" value="${x.date||''}"><label>Tipo / descrição</label><input id="hkind" value="${esc(x.kind||'')}"><label>Valor (opcional)</label><input id="hamount" inputmode="decimal" value="${esc(x.amount||'')}"><label>Observações</label><textarea id="hnotes">${esc(x.notes||'')}</textarea><label>Recibo ou comprovante (até 1,5 MB)</label><input id="hfile" type="file" accept="image/*,.pdf"><div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button style="background:var(--c);color:#fff" onclick="saveHelp('${x.id}')">Salvar</button></div>${id?`<button class="primary danger" style="margin-top:10px;background:#fff;border:1px solid #eee" onclick="delHelp('${x.id}')">Excluir</button>`:''}`;modal.classList.remove('hide')}async function saveHelp(id){let old=state.assistance.find(x=>x.id===id)||{};let f=document.querySelector('#hfile').files[0],data=old.fileData||'',fileName=old.fileName||'';if(f){if(f.size>1572864)return alert('O arquivo precisa ter até 1,5 MB.');data=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});fileName=f.name}let x={...old,id,name:hname.value,date:hdate.value,kind:hkind.value,amount:hamount.value,notes:hnotes.value,fileData:data,fileName,updatedBy:me.name};let i=state.assistance.findIndex(y=>y.id===id);i<0?state.assistance.push(x):state.assistance[i]=x;await save();closeModal();assistance()}async function delHelp(id){state.assistance=state.assistance.filter(x=>x.id!==id);await save();closeModal();assistance()}async function admin(){let j=await call('profiles');view.innerHTML=`<div class="sectionHead"><div><h2>Acessos da Presidência</h2><div class="meta">Somente você pode criar ou redefinir as senhas</div></div></div><div class="list">${j.profiles.map(p=>`<div class="row adminrow"><div><h3>${esc(p.display_name)}</h3><div class="meta">${esc(p.role_label)}</div><div class="tag">${p.password_ready?'Senha criada':'Sem senha'}</div></div><button class="smallbtn" onclick="passwordFor('${p.id}','${esc(p.display_name)}')">${p.password_ready?'Trocar':'Criar'} senha</button></div>`).join('')}</div><button class="primary" style="margin-top:18px;background:#fff;color:var(--red);border:1px solid #e1e4e6" onclick="logout()">Sair do app</button>`}function passwordFor(id,name){sheet.innerHTML=`<h2>Senha de ${name.split(' ')[0]}</h2><p class="mut">Crie a senha e entregue diretamente ao irmão. Ela não ficará visível depois.</p><input id="newpw" type="password" placeholder="Nova senha (mínimo 6 caracteres)"><div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button style="background:var(--c);color:#fff" onclick="setPw('${id}')">Salvar senha</button></div>`;modal.classList.remove('hide')}async function setPw(id){try{await call('setPassword',{profileId:id,password:newpw.value});closeModal();admin();alert('Senha atualizada.')}catch(e){alert(e.message)}}function closeModal(){modal.classList.add('hide')}function logout(){localStorage.removeItem('qv_token');location.reload()}if(token)load();</script></body></html>
